<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>SocialShieldAI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            margin: 0;
            padding: 40px 20px;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .input-section {
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
        }

        .input-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 28px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #loading {
            text-align: center;
            margin-top: 20px;
            display: none;
            color: #555;
        }

        #result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            background: #f7f7f7;
            border: 1px solid #ddd;
            display: none;
        }

        .result-heading {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #666;
        }

        .prediction {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin: 15px 0 25px;
        }

        .prediction.fake {
            color: #c62828;
        }

        .prediction.real {
            color: #2e7d32;
        }

        .result-card p {
            font-size: 16px;
            margin: 12px 0;
        }

        .risk-title {
            margin-top: 22px;
            font-weight: bold;
            font-size: 17px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 10px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="logo">🛡️</div>

    <h1>SocialShieldAI</h1>

    <div class="subtitle">
        AI-Based Fake Profile Detection
    </div>

    <div class="section-title">
        Instagram Profile Analysis
    </div>


    <div class="input-section">

        <div class="input-title">
            Profile Information
        </div>


        <label>Follower Count</label>

        <input
            type="number"
            id="followers"
            min="0"
            placeholder="Enter follower count"
        >


        <label>Following Count</label>

        <input
            type="number"
            id="following"
            min="0"
            placeholder="Enter following count"
        >


        <label>Biography Length</label>

        <input
            type="number"
            id="bio"
            min="0"
            placeholder="Enter biography length"
        >


        <label>Media Count</label>

        <input
            type="number"
            id="media"
            min="0"
            placeholder="Enter number of posts"
        >


        <label>Has Profile Picture?</label>

        <select id="profilePic">

            <option value="1">
                Yes
            </option>

            <option value="0">
                No
            </option>

        </select>


        <label>Private Account?</label>

        <select id="private">

            <option value="1">
                Yes
            </option>

            <option value="0">
                No
            </option>

        </select>


        <label>Username Digit Count</label>

        <input
            type="number"
            id="digits"
            min="0"
            placeholder="Example: john123 = 3"
        >


        <label>Username Length</label>

        <input
            type="number"
            id="usernameLength"
            min="0"
            placeholder="Enter username length"
        >

    </div>


    <button onclick="analyzeProfile()">
        ANALYZE PROFILE
    </button>


    <div id="loading">
        Analyzing profile...
    </div>


    <div id="result"></div>

</div>


<script>

async function analyzeProfile() {

    const resultBox =
        document.getElementById("result");

    const loading =
        document.getElementById("loading");


    resultBox.style.display = "none";

    loading.style.display = "block";


    const data = {

        userFollowerCount:
            Number(
                document.getElementById("followers").value
            ),

        userFollowingCount:
            Number(
                document.getElementById("following").value
            ),

        userBiographyLength:
            Number(
                document.getElementById("bio").value
            ),

        userMediaCount:
            Number(
                document.getElementById("media").value
            ),

        userHasProfilPic:
            Number(
                document.getElementById("profilePic").value
            ),

        userIsPrivate:
            Number(
                document.getElementById("private").value
            ),

        usernameDigitCount:
            Number(
                document.getElementById("digits").value
            ),

        usernameLength:
            Number(
                document.getElementById("usernameLength").value
            )
    };


    try {

        const response = await fetch(
            "http://127.0.0.1:8000/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        const result =
            await response.json();


        loading.style.display = "none";

        resultBox.style.display = "block";


        if (result.error) {

            resultBox.innerHTML = `

                <div class="error">

                    Error: ${result.error}

                </div>

            `;

            return;
        }


        let riskHTML = "";


        if (
            result.risk_factors &&
            result.risk_factors.length > 0
        ) {

            riskHTML = `

                <div class="risk-title">
                    Risk Analysis:
                </div>

                <ul>

                    ${result.risk_factors
                        .map(
                            factor =>
                            `<li>⚠ ${factor}</li>`
                        )
                        .join("")}

                </ul>

            `;

        }


        let predictionClass = "";


        if (result.prediction === "FAKE") {

            predictionClass = "fake";

        } else {

            predictionClass = "real";

        }


        resultBox.innerHTML = `

            <div class="result-card">

                <div class="result-heading">
                    ANALYSIS RESULT
                </div>


                <div class="prediction ${predictionClass}">
                    ${result.prediction}
                </div>


                <p>
                    <strong>Confidence:</strong>
                    ${result.confidence}%
                </p>


                <p>
                    <strong>Confidence Level:</strong>
                    ${result.confidence_level}
                </p>


                ${riskHTML}

            </div>

        `;

    }


    catch (error) {

        loading.style.display = "none";

        resultBox.style.display = "block";


        resultBox.innerHTML = `

            <div class="error">

                Unable to connect to the
                SocialShieldAI server.

                <br><br>

                Make sure the backend is running.

            </div>

        `;

    }

}

</script>


</body>

</html>
